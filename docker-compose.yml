services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskflow-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - taskflow-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskFlowDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"

      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "TaskFlow.Api"
      Jwt__Audience: "TaskFlow.Client"
      Jwt__ExpiryMinutes: "60"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  taskflow-sql-data:
